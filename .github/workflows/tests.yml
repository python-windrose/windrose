name: Tests

# no permissions by default
permissions: {}

on:
  pull_request:
  push:
    branches: [main]

jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ "3.11", "3.15" ]
        os: [ ubuntu-latest ]
        include:
          - os: windows-latest
            python-version: "3.15"
          - os: macos-latest
            python-version: "3.15"
      fail-fast: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install windrose
      run: |
        python -m pip install --group dev
        python -m pip install -e .[extras]

    - name: Code Tests
      run: |
        pytest -s -rxs -vv -Werror tests/

    - name: MPL Tests
      if: ${{ matrix.os == 'ubuntu' }}
      run: |
        pytest -s -rxs -vv -Werror tests/ --mpl --mpl-generate-summary=html \
        --mpl-results-path="windrose_test_output-${{ matrix.os }}-${{ matrix.python-version }}"

    - name: Store mpl-results
      if: ${{ matrix.os == 'ubuntu'  && failure() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: "windrose_test_output-${{ matrix.os }}-${{ matrix.python-version }}"
        path: "windrose_test_output-${{ matrix.os }}-${{ matrix.python-version }}"
        retention-days: 1
